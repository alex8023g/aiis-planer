# Локальная инфраструктура для разработки: `docker compose up -d`.
#
# MinIO — хранилище файлов договоров (см. src/lib/minio.ts). Образ pgsty/minio —
# поддерживаемая сборка MinIO с веб-консолью. Ключи берутся из того же .env, что
# читает приложение: MINIO_ACCESS_KEY/MINIO_SECRET_KEY и есть root-учётка, так
# что завести их нужно в одном месте. Бакет приложение создаёт само.
services:
  minio:
    image: pgsty/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY не задан в .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY не задан в .env}
    ports:
      - '${MINIO_PORT:-9000}:9000' # S3 API
      - '${MINIO_CONSOLE_PORT:-9001}:9001' # веб-консоль: http://localhost:<MINIO_CONSOLE_PORT>
    volumes:
      # Каталог данных можно переопределить в .env через MINIO_DATA_DIR,
      # например, чтобы подхватить уже существующие файлы.
      - ${MINIO_DATA_DIR:-./.minio-data}:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
